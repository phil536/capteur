<html>
	<head>
	<title>IoT	: MQTT sur WebSocket</title>
	<script src="js/paho-mqtt-min.js"></script>
	<script type= "text/javascript" language="javascript">
	var mqtt ;
	var host = "broker.hivemq.com";
	var port = 8884;

function onFailure(message){
	console.log(" Echec de connexion a " +host) ;
	setTimeout(MQTTconnect, 2000) ;
}

function onMessageArrived(msg){

    console.log("MESSAGE RECU");
    console.log("TOPIC =", msg.destinationName);
    console.log("RAW =", msg.payloadString);

    if (msg.destinationName.includes("chambre") === false) {
        return; // ignore tous les autres messages
    }

    let msg_JSON;

    try {
        msg_JSON = JSON.parse(msg.payloadString);
    } catch (e) {
        console.log("JSON invalide");
        return;
    }

    if (msg_JSON.object && msg_JSON.object.temperature !== undefined) {
        document.getElementById("data").innerHTML = Number(msg_JSON.object.temperature).toFixed(2) + " °C";
    }

    if (msg_JSON.object && msg_JSON.object.humidity !== undefined) {
        document.getElementById("data2").innerHTML = Number(msg_JSON.object.humidity).toFixed(2) + " %";
    }

    if (msg_JSON.object && msg_JSON.object.perceivedtemp !== undefined) {
        document.getElementById("data3").innerHTML = Number(msg_JSON.object.perceivedtemp).toFixed(2) + " °C";
    }

    if (msg_JSON.deviceName) {
        document.getElementById("device").innerHTML = msg_JSON.deviceName;
    }

    // Heure de réception
     let maintenant = new Date();

    document.getElementById("lastUpdate").innerHTML =
         maintenant.toLocaleTimeString();
}

function onConnect(){
	mqtt.subscribe("app/#") ;//topic
    document.getElementById("data").innerHTML= "Télémétrie inactive";
}
function MQTTconnect() {
	mqtt=new Paho.MQTT.Client(host, port, "webClient-" + Math.random().toString(16).substr(2, 8)) ;
	mqtt.onMessageArrived=onMessageArrived ;
	var options = {useSSL: true , onSuccess :onConnect, onFailure:onFailure,};
	mqtt.connect(options);
}

</script>
